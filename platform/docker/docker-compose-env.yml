networks:
  jason-lab-net:
    external: true
    name: jason-lab-net

# 共通ロギング設定（コンテナログの肥大化防止: 最大20MB x 3世代 = 60MB）
x-logging: &default-logging
  logging:
    driver: "json-file"
    options:
      max-size: "20m"
      max-file: "3"

services:

  # Nginx (インフラコンテナ: smart-dx-nginx)
  smart-dx-nginx:
    <<: *default-logging
    image: nginx:stable-alpine
    container_name: smart-dx-nginx
    restart: unless-stopped
    volumes:
      - ${BASEPATH:-/mydata}/nginx/conf/nginx.conf:/etc/nginx/nginx.conf
      - ${BASEPATH:-/mydata}/nginx/conf/conf.d:/etc/nginx/conf.d
      - ${BASEPATH:-/mydata}/nginx/html:/usr/share/nginx/html
      - ${BASEPATH:-/mydata}/nginx/logs:/var/log/nginx
    ports:
      - "80:80"
      - "443:443"
    networks:
      jason-lab-net:
        aliases:
          - nginx
          - smart-dx-nginx


  # MySQL for smart-retail
  smart-retail-mysql:
    <<: *default-logging
    image: mysql:8.0.29
    container_name: smart-retail-mysql-8
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: "123456"
      MYSQL_ROOT_HOST: "%"
      TZ: Asia/Tokyo
      LANG: en_US.UTF-8
    command: ["mysqld", "--character-set-server=utf8mb4", "--collation-server=utf8mb4_general_ci"]
    volumes:
      - ./sql/mysql-init:/docker-entrypoint-initdb.d
      - ${BASEPATH:-/mydata}/mysql_3306/conf/my.cnf:/etc/my.cnf
      - ${BASEPATH:-/mydata}/mysql_3306/data:/var/lib/mysql
      - ${BASEPATH:-/mydata}/mysql_3306/log:/var/log/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p123456"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      jason-lab-net:
        aliases:
          - powerjob-mysql
          - smart-retail-mysql

  # PowerJob Server
  smart-retail-powerjob-server:
    <<: *default-logging
    image: powerjob/powerjob-server:latest
    container_name: smart-retail-powerjob-server
    restart: unless-stopped
    environment:
      TZ: Asia/Tokyo
      JVMOPTIONS: "-Xmx512m"
      PARAMS: "--spring.datasource.core.jdbc-url=jdbc:mysql://powerjob-mysql:3306/powerjob?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Tokyo --spring.datasource.core.username=root --spring.datasource.core.password=123456 --oms.storage.dfs.mysql_series.url=jdbc:mysql://powerjob-mysql:3306/powerjob?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Tokyo --oms.storage.dfs.mysql_series.username=root --oms.storage.dfs.mysql_series.password=123456"
    ports:
      - "7700:7700"
      - "10086:10086"
    networks:
      - jason-lab-net
    depends_on:
      smart-retail-mysql:
        condition: service_healthy

  # Redis for smart-retail / smart-property (インフラコンテナ: smart-dx-redis)
  smart-dx-redis:
    <<: *default-logging
    image: redis:7.2-alpine
    container_name: smart-dx-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "/etc/redis/redis.conf", "--requirepass", "${REDIS_PASSWORD:-123456}"]
    volumes:
      - ${BASEPATH:-/mydata}/redis/conf/redis.conf:/etc/redis/redis.conf:ro
      - ${BASEPATH:-/mydata}/redis/data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-123456}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      jason-lab-net:
        aliases:
          - redis
          - smart-dx-redis
          - smart-retail-redis

  # OpenSearch (インフラコンテナ: smart-dx-opensearch)
  smart-dx-opensearch:
    <<: *default-logging
    build:
      context: ./opensearch
      args:
        OPENSEARCH_VERSION: ${OPENSEARCH_VERSION:-2.19.1}
    image: smart-dx-opensearch:${OPENSEARCH_VERSION:-2.19.1}
    container_name: smart-dx-opensearch
    restart: unless-stopped
    environment:
      - TZ=Asia/Tokyo
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true
      - DISABLE_INSTALL_DEMO_CONFIG=true
      - bootstrap.memory_lock=true
      - OPENSEARCH_JAVA_OPTS=-Xms${OPENSEARCH_HEAP:-1g} -Xmx${OPENSEARCH_HEAP:-1g}
    ports:
      - "${OPENSEARCH_HTTP_PORT:-9200}:9200"
      - "${OPENSEARCH_TRANSPORT_PORT:-9301}:9300"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - smart-dx-opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS 'http://127.0.0.1:9200/_cluster/health?wait_for_status=yellow&timeout=5s' >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 60
    networks:
      jason-lab-net:
        aliases:
          - opensearch
          - smart-dx-opensearch
          - smart-property-opensearch

  # OpenSearch Init (インフラコンテナ: smart-dx-opensearch-init)
  smart-dx-opensearch-init:
    <<: *default-logging
    build:
      context: ./opensearch-init
      args:
        ALPINE_VERSION: ${ALPINE_VERSION:-3.20}
    image: smart-dx-opensearch-init:${ALPINE_VERSION:-3.20}
    container_name: smart-dx-opensearch-init
    depends_on:
      smart-dx-opensearch:
        condition: service_healthy
    environment:
      - OPENSEARCH_URL=http://smart-dx-opensearch:9200
    volumes:
      - ./opensearch/init:/init:ro
    command: ["/init/init-opensearch.sh"]
    restart: "no"
    networks:
      - jason-lab-net

  # OpenSearch Dashboards (インフラコンテナ: smart-dx-opensearch-dashboards)
  smart-dx-opensearch-dashboards:
    <<: *default-logging
    image: opensearchproject/opensearch-dashboards:${OPENSEARCH_VERSION:-2.19.1}
    platform: ${PLATFORM:-linux/arm64}
    container_name: smart-dx-opensearch-dashboards
    restart: unless-stopped
    depends_on:
      smart-dx-opensearch:
        condition: service_healthy
    environment:
      - TZ=Asia/Tokyo
      - DISABLE_SECURITY_DASHBOARDS_PLUGIN=true
    volumes:
      - ./opensearch-dashboards/opensearch_dashboards.yml:/usr/share/opensearch-dashboards/config/opensearch_dashboards.yml:ro
    ports:
      - "${OPENSEARCH_DASHBOARDS_PORT:-5601}:5601"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS 'http://127.0.0.1:5601/api/status' >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 60
    networks:
      - jason-lab-net

volumes:
  smart-dx-opensearch-data:
